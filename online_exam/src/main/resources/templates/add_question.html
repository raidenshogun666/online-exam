<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>添加题目</title>
</head>
<body>
<div th:replace="fragments/nav :: nav"></div>
<h2>给考试添加题目（exam_id = <span th:text="${examId}"></span>）</h2>

<form th:action="@{'/exams/' + ${examId} + '/questions/add'}" method="post">
  <div>
    题干：<br>
    <textarea name="content" rows="4" cols="60" required></textarea>
  </div>

  <div>
    分值：<input type="number" name="score" min="1" required>
  </div>

  <div>
    选项A：<input type="text" name="a" required>
  </div>
  <div>
    选项B：<input type="text" name="b" required>
  </div>
  <div>
    选项C：<input type="text" name="c" required>
  </div>
  <div>
    选项D：<input type="text" name="d" required>
  </div>

  <div>
    正确选项：
    <select name="correctIndex" required>
      <option value="A">A</option>
      <option value="B">B</option>
      <option value="C">C</option>
      <option value="D">D</option>
    </select>
  </div>

  <div>
    <button type="submit">提交</button>
  </div>
</form>

<p><a href="/exams">返回考试列表</a></p>

</body>
</html>
