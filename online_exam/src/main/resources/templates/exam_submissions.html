<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>考试成绩</title>
</head>
<body>

<div th:replace="fragments/nav :: nav"></div>

<h2>考试成绩（exam_id = <span th:text="${examId}"></span>）</h2>

<table border="1">
  <tr>
    <th>学生ID</th>
    <th>用户名</th>
    <th>提交时间</th>
    <th>总分</th>
    <th>操作</th>
  </tr>

  <tr th:each="s : ${submissions}">
    <td th:text="${s.studentId}"></td>
    <td th:text="${s.username}"></td>
    <td th:text="${s.submitTime}"></td>
    <td th:text="${s.totalScore}"></td>
    <td>
      <a th:href="@{'/exams/' + ${examId} + '/submissions/' + ${s.studentId}}">查看详情</a>
    </td>
  </tr>
</table>

<p><a href="/exams">返回考试列表</a></p>

</body>
</html>
