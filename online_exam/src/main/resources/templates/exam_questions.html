<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>考试题目列表</title>
</head>
<body>
<div th:replace="fragments/nav :: nav"></div>
<h2>考试题目列表（exam_id = <span th:text="${examId}"></span>）</h2>

<div th:if="${#lists.isEmpty(questions)}">
  <p>该考试暂无题目。</p>
</div>

<div th:each="q, stat : ${questions}">
  <hr>
  <p>
    <b th:text="'第 ' + ${stat.index + 1} + ' 题：'"></b>
    <span th:text="${q.content}"></span>
    （<span th:text="${q.score}"></span> 分）
  </p>

  <ul>
    <li th:each="op : ${q.options}">
      <span th:text="${op.content}"></span>
      <b th:if="${op.isCorrect}">【正确】</b>
    </li>
  </ul>
</div>

<p>
  <a th:href="@{'/exams/' + ${examId} + '/questions/addPage'}">继续添加题目</a>
</p>
<p><a href="/exams">返回考试列表</a></p>

</body>
</html>
