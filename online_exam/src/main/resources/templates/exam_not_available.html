<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>无法参加考试</title>
</head>
<body>

<div th:replace="fragments/nav :: nav"></div>

<h2>无法参加考试（exam_id = <span th:text="${examId}"></span>）</h2>

<div th:if="${status == 'NOT_STARTED'}">
    <p>该考试尚未开始。</p>
</div>

<div th:if="${status == 'ENDED'}">
    <p>该考试已结束，无法进入或提交。</p>
</div>

<p>开始时间：<span th:text="${startTime}"></span></p>
<p>结束时间：<span th:text="${endTime}"></span></p>

<p><a href="/exams">返回考试列表</a></p>

</body>
</html>
